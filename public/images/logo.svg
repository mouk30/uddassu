<svg viewBox="0 0 760 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <linearGradient id="sealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <linearGradient id="stepRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="stepYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="stepGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
    <linearGradient id="stepTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>

    <radialGradient id="greenSproutDot" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="50%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </radialGradient>

    <clipPath id="boolLowerClip2">
      <rect x="390" y="78" width="100" height="60" />
    </clipPath>
  </defs>

  <g id="left-section" filter="url(#logoShadow)">
    <text x="14" y="76" font-family="'Gaegu', 'Dongle', 'Do Hyeon', 'Noto Sans KR', sans-serif" font-size="68" font-weight="900" letter-spacing="-1" fill="#ffffff" stroke="#1c1917" stroke-width="4" paint-order="stroke fill">어따써</text>

    <g id="seal-stamp" transform="translate(204, 18)">
      <rect x="0" y="0" width="26" height="26" rx="6" fill="url(#sealGrad)" stroke="#fca5a5" stroke-width="1.5" />
      <path d="M13 6 C8 6 6 9.5 6 13 C6 17 9.5 20 13.5 20 C17.5 20 20 17 19.5 13.5 C19 10.5 16.5 9 13.5 9.5 C11 10 9.5 12 10 14 C10.5 15.5 12 16.5 13.5 16 C14.5 15.5 15 14.5 14.5 13.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" />
    </g>

    <g id="stepped-color-bar" transform="translate(14, 94)">
      <path d="M0 6 L44 5 L44 22 L0 23 Z" fill="url(#stepRed)" stroke="#1c1917" stroke-width="1.5" />
      <path d="M44 5 L88 3 L88 20 L44 22 Z" fill="url(#stepYellow)" stroke="#1c1917" stroke-width="1.5" />
      <path d="M88 3 Q110 2 136 0 L142 0 L142 17 L88 20 Z" fill="url(#stepGreen)" stroke="#1c1917" stroke-width="1.5" />
      <path d="M142 7 L190 8 L190 17 L142 17 Z" fill="url(#stepTeal)" stroke="#1c1917" stroke-width="1.5" />
    </g>

    <text x="22" y="142" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="20" font-weight="800" letter-spacing="2.5" fill="#e2e8f0" stroke="#0f172a" stroke-width="2" paint-order="stroke fill">숯불 꼼장어 전문점</text>
  </g>

  <g id="right-section" filter="url(#logoShadow)">
    <g id="char-sooth">
      <text x="272" y="108" font-family="'Gaegu', 'Black Han Sans', 'Do Hyeon', 'Noto Sans KR', sans-serif" font-size="106" font-weight="900" fill="#fbbf24" stroke="#1c1917" stroke-width="6" paint-order="stroke fill">숯</text>
      <text x="272" y="108" font-family="'Gaegu', 'Black Han Sans', 'Do Hyeon', 'Noto Sans KR', sans-serif" font-size="106" font-weight="900" fill="#ffffff">숯</text>
      <text x="272" y="108" font-family="'Gaegu', 'Black Han Sans', 'Do Hyeon', 'Noto Sans KR', sans-serif" font-size="106" font-weight="900" fill="#f59e0b" opacity="0.85">숯</text>
    </g>

    <g id="char-bool">
      <text x="396" y="108" font-family="'Gaegu', 'Black Han Sans', 'Do Hyeon', 'Noto Sans KR', sans-serif" font-size="106" font-weight="900" fill="#ffffff" stroke="#1c1917" stroke-width="6" paint-order="stroke fill">불</text>
      <text x="396" y="108" font-family="'Gaegu', 'Black Han Sans', 'Do Hyeon', 'Noto Sans KR', sans-serif" font-size="106" font-weight="900" fill="#ef4444" clip-path="url(#boolLowerClip2)">불</text>
    </g>

    <g id="char-po">
      <text x="512" y="108" font-family="'Gaegu', 'Black Han Sans', 'Do Hyeon', 'Noto Sans KR', sans-serif" font-size="106" font-weight="900" fill="#ffffff" stroke="#1c1917" stroke-width="6" paint-order="stroke fill">포</text>
      <circle cx="548" cy="62" r="7.5" fill="url(#greenSproutDot)" stroke="#27272a" stroke-width="1.5" />
      <ellipse cx="546" cy="60" rx="2.5" ry="1.5" fill="#f7fee7" />
    </g>

    <g id="char-cha">
      <text x="626" y="108" font-family="'Gaegu', 'Black Han Sans', 'Do Hyeon', 'Noto Sans KR', sans-serif" font-size="106" font-weight="900" fill="#ffffff" stroke="#1c1917" stroke-width="6" paint-order="stroke fill">차</text>
    </g>

    <g id="branch-badge" transform="translate(562, 126)">
      <rect x="0" y="0" width="134" height="38" rx="19" fill="#09090b" stroke="#52525b" stroke-width="2.5" />
      <text x="67" y="25" text-anchor="middle" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="19" font-weight="900" letter-spacing="3" fill="#ffffff">사천점</text>
    </g>
  </g>
</svg>
