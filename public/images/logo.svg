<svg viewBox="0 0 680 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cyanNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#06b6d4" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="orangeNeonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#f97316" flood-opacity="0.7" />
    </filter>
    <filter id="solidShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <linearGradient id="eottaTextGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="soothCharGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="25%" stop-color="#60a5fa" />
      <stop offset="65%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="boolCharGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="35%" stop-color="#22d3ee" />
      <stop offset="75%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="poCharGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="80%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="chaCharGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>

    <linearGradient id="swirlBoxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#083344" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
    <linearGradient id="swirlLineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#06b6d4" /><stop offset="100%" stop-color="#0ea5e9" /></linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0284c7" /><stop offset="100%" stop-color="#2563eb" /></linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4338ca" /><stop offset="100%" stop-color="#6b21a8" /></linearGradient>
    <linearGradient id="bar4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#86198f" /><stop offset="100%" stop-color="#c026d3" /></linearGradient>
    <linearGradient id="bar5" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#e11d48" /><stop offset="100%" stop-color="#f97316" /></linearGradient>

    <radialGradient id="purpleGemGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f3e8ff" />
      <stop offset="30%" stop-color="#c084fc" />
      <stop offset="75%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </radialGradient>
    <radialGradient id="orangeSparkGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="40%" stop-color="#fb923c" />
      <stop offset="85%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </radialGradient>
  </defs>

  <!-- LEFT BLOCK -->
  <g id="left-block" filter="url(#solidShadow)">
    <text x="8" y="54" font-family="'Do Hyeon', 'Black Han Sans', 'Noto Sans KR', sans-serif" font-size="54" font-weight="900" letter-spacing="2" fill="url(#eottaTextGrad)" stroke="#090d16" stroke-width="3.5" paint-order="stroke fill">어따써</text>
    <g id="swirl-badge" transform="translate(198, 14)">
      <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#swirlBoxGrad)" stroke="#22d3ee" stroke-width="1.8" />
      <path d="M16 7 C10 7 6.5 11 6.5 16 C6.5 21.5 11 25.5 16.5 25.5 C21.5 25.5 24.5 22 24 17 C23.5 13 20 11 16.5 11.5 C13.5 12 11.5 14.5 12 17 C12.5 19.5 14.5 20.5 16.5 20 C18 19.5 19 18 18.5 16.5 C18 15.5 17 15 16 15.5" fill="none" stroke="url(#swirlLineGrad)" stroke-width="2.8" stroke-linecap="round" />
      <circle cx="16" cy="16" r="1.5" fill="#ffffff" />
    </g>

    <g id="five-color-bar" transform="translate(8, 66)">
      <rect x="0" y="0" width="224" height="13" rx="3" fill="#090d16" />
      <rect x="0" y="0" width="46" height="12" rx="3" fill="url(#bar1)" />
      <rect x="44" y="0" width="46" height="12" fill="url(#bar2)" />
      <rect x="88" y="0" width="46" height="12" fill="url(#bar3)" />
      <rect x="132" y="0" width="46" height="12" fill="url(#bar4)" />
      <path d="M176 0 L220 0 Q225 0 224 6 Q223 12 218 12 L176 12 Z" fill="url(#bar5)" />
      <line x1="20" y1="2.5" x2="40" y2="2.5" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round" />
      <line x1="95" y1="2.5" x2="120" y2="2.5" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.4" stroke-linecap="round" />
      <line x1="185" y1="2.5" x2="215" y2="2.5" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round" />
    </g>

    <text x="10" y="102" font-family="'Pretendard', 'Noto Sans KR', sans-serif" font-size="16" font-weight="800" letter-spacing="3.5" fill="#e2e8f0" stroke="#090d16" stroke-width="2" paint-order="stroke fill">숯불 꼼장어 전문점</text>
  </g>

  <!-- RIGHT BLOCK: 숯 불 포 차 -->
  <g id="right-block" filter="url(#solidShadow)">
    <!-- 숯 -->
    <g id="char-sooth-unit">
      <text x="255" y="82" font-family="'Do Hyeon', 'Black Han Sans', 'Noto Sans KR', sans-serif" font-size="84" font-weight="900" fill="url(#soothCharGrad)" stroke="#091428" stroke-width="5" paint-order="stroke fill">숯</text>
      <path d="M266 52 Q285 50 318 52" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
    </g>

    <!-- 불 -->
    <g id="char-bool-unit" filter="url(#cyanNeonGlow)">
      <text x="362" y="82" font-family="'Do Hyeon', 'Black Han Sans', 'Noto Sans KR', sans-serif" font-size="84" font-weight="900" fill="url(#boolCharGrad)" stroke="#082838" stroke-width="5" paint-order="stroke fill">불</text>
      <path d="M374 24 L374 48" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8" />
    </g>

    <!-- 포 -->
    <g id="char-po-unit">
      <text x="470" y="82" font-family="'Do Hyeon', 'Black Han Sans', 'Noto Sans KR', sans-serif" font-size="84" font-weight="900" fill="url(#poCharGrad)" stroke="#0f172a" stroke-width="5" paint-order="stroke fill">포</text>
      <g id="purple-gem" transform="translate(506, 33)">
        <circle cx="0" cy="0" r="8" fill="url(#purpleGemGrad)" stroke="#c084fc" stroke-width="1.8" />
        <circle cx="-2.5" cy="-2.5" r="2.2" fill="#ffffff" />
      </g>
    </g>

    <!-- 차 -->
    <g id="char-cha-unit">
      <text x="575" y="82" font-family="'Do Hyeon', 'Black Han Sans', 'Noto Sans KR', sans-serif" font-size="84" font-weight="900" fill="url(#chaCharGrad)" stroke="#18120c" stroke-width="5" paint-order="stroke fill">차</text>
      <g id="orange-spark" transform="translate(607, 16)" filter="url(#orangeNeonGlow)">
        <circle cx="0" cy="0" r="7" fill="url(#orangeSparkGrad)" stroke="#fed7aa" stroke-width="1.5" />
        <path d="M-2 -2 Q0 -6 2 -2 Q5 2 0 4 Q-4 2 -2 -2 Z" fill="#ffffff" opacity="0.9" />
      </g>
    </g>
  </g>
</svg>
